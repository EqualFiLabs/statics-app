name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ponder/package-lock.json
      - run: npm ci
      - run: npm ci --prefix ponder
      - run: npm run lint
      - run: npm run lint:css
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm --prefix ponder run typecheck
      - run: npm test
      - run: npm --prefix ponder test
      - run: npm run build
